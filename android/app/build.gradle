plugins { id 'com.android.application' }

android {
    namespace 'org.ra3native'
    compileSdk 34
    defaultConfig {
        applicationId 'org.ra3native'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DLIFTED_DIR=" + (project.findProperty('liftedDir') ?: '')
                cppFlags '-std=c++17'
            }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
    buildTypes {
        debug { debuggable true }
    }
}
