plugins { id 'com.android.application' }

android {
    namespace 'org.ra3native'
    compileSdk 34
    defaultConfig {
        applicationId 'org.ra3native'
        minSdk 29
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as Integer)
        versionName(project.findProperty('versionName') ?: 'dev')
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField "String", "BUILD_ID", "\"${project.findProperty('buildId') ?: 'local'}\""
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DLIFTED_DIR=" + (project.findProperty('liftedDir') ?: ''),
                          "-DLIFTED_DIR_113=" + (project.findProperty('liftedDir113') ?: ''),
                          "-DGLSLANG_DIR=" + (project.findProperty('glslangDir') ?: ''),
                          *(project.hasProperty('useCcache') ? ["-DCMAKE_CXX_COMPILER_LAUNCHER=ccache", "-DCMAKE_C_COMPILER_LAUNCHER=ccache"] : [])
                cppFlags '-std=c++17'
            }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
    // two apps from one code base: RA3 Native for the retail / EA app game (ra3_1.12.game) and RA3 Native Steam for
    // the Steam release (ra3_1.13.game); separate application ids, so both install side by side
    flavorDimensions 'game'
    productFlavors {
        classic {
            dimension 'game'
            manifestPlaceholders = [appLabel: 'RA3 Native']
            buildConfigField "boolean", "STEAM", "false"
            externalNativeBuild { cmake { arguments "-DGAME=112" } }
        }
        steam {
            dimension 'game'
            applicationIdSuffix '.steam'
            manifestPlaceholders = [appLabel: 'RA3 Native Steam']
            buildConfigField "boolean", "STEAM", "true"
            externalNativeBuild { cmake { arguments "-DGAME=113" } }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        // fixed key (private repo, test app) so every CI build is signed identically and installs over the previous one
        main {
            storeFile file('ra3native.keystore')
            storePassword 'ra3native'
            keyAlias 'ra3native'
            keyPassword 'ra3native'
        }
    }
    buildTypes {
        debug { debuggable true; signingConfig signingConfigs.main }
    }
}
