name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['runtime/**', 'tools/**', 'android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      # The user's own ra3_1.12.game is attached to a draft/private release (tag "game-binary") of this private repo.
      # It is only used to generate code inside this job; neither it nor the generated code is published.
      - name: Fetch ra3_1.12.game
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release download game-binary -p ra3_1.12.game -D game

      - name: Build Capstone
        run: |
          git clone https://github.com/capstone-engine/capstone
          git -C capstone checkout 04fd70b5456c20fc27d1f2b62d6ed0820fc6b081
          sudo apt-get install -y ninja-build >/dev/null
          cmake -S capstone -B capstone/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_X86_SUPPORT=ON -DCAPSTONE_BUILD_SHARED_LIBS=OFF -DCAPSTONE_BUILD_TESTS=OFF -DCAPSTONE_BUILD_CSTOOL=OFF -DCAPSTONE_BUILD_CSTEST=OFF -DCAPSTONE_BUILD_LEGACY_TESTS=OFF
          ninja -C capstone/b

      - name: Analyze and lift
        run: |
          g++ -O2 -std=c++17 -Icapstone/include tools/analyze.cpp capstone/b/libcapstone.a -o analyze
          g++ -O2 -std=c++17 -Icapstone/include tools/lift.cpp tools/lift_pe.cpp capstone/b/libcapstone.a -o lift_pe
          ./analyze game/ra3_1.12.game game/ra3
          mkdir -p lifted
          ./lift_pe game/ra3_1.12.game game/ra3.functions.txt --emit-dir lifted 96 | head -3

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug -PliftedDir=${{ github.workspace }}/lifted --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ra3-native-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
