name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['runtime/**', 'tools/**', 'android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # The ubuntu runner already ships the Android SDK/NDK; just accept licences.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      # The user's own ra3_1.12.game lives in a separate PRIVATE repo (blackorange-sketch/ra3-private, release "game-binary"),
      # read with the GAME_REPO_TOKEN secret. It is only used inside this job; neither it nor the generated code is published.
      - name: Fetch ra3_1.12.game
        env: { GH_TOKEN: '${{ secrets.GAME_REPO_TOKEN }}' }
        run: gh release download game-binary -R blackorange-sketch/ra3-private -p ra3_1.12.game -D game

      - name: Build Capstone
        run: |
          git clone https://github.com/capstone-engine/capstone
          git -C capstone checkout 04fd70b5456c20fc27d1f2b62d6ed0820fc6b081
          sudo apt-get install -y ninja-build >/dev/null
          cmake -S capstone -B capstone/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_X86_SUPPORT=ON -DCAPSTONE_BUILD_SHARED_LIBS=OFF -DCAPSTONE_BUILD_TESTS=OFF -DCAPSTONE_BUILD_CSTOOL=OFF -DCAPSTONE_BUILD_CSTEST=OFF -DCAPSTONE_BUILD_LEGACY_TESTS=OFF
          ninja -C capstone/b

      - name: Analyze and lift
        run: |
          g++ -O2 -std=c++17 -Icapstone/include tools/analyze.cpp capstone/b/libcapstone.a -o analyze
          g++ -O2 -std=c++17 -Icapstone/include tools/lift.cpp tools/lift_pe.cpp capstone/b/libcapstone.a -o lift_pe
          ./analyze game/ra3_1.12.game game/ra3
          mkdir -p lifted
          # RA3_HOOKS: debug hooks (log arguments/result of these functions): 9ff320 = archive (BIG) stream open by path
          RA3_HOOKS=9ff320,9b85c0,9c6870,aa41d0,aa4170,aa4dd0,aa4f80,aa5290,aa5320,aa56c0,aa5710,aa5740,aa5830,aa5950,aa5d20,aa57d0,61d660,aa9ea0,aaa0e0,aaa100,aaa130,aaa160,aaa420,aaa4d0,aaa540,aaa5e0,afa2a0,afa960,61c0d0,61c040,af9790,afada0,afae60 ./lift_pe game/ra3_1.12.game game/ra3.functions.txt --emit-dir lifted 96 | head -3

      # The generated code is identical between runs, so ccache makes rebuilds after runtime-only edits take minutes.
      - name: Set up ccache
        run: sudo apt-get install -y ccache >/dev/null
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Stamp build id
        run: echo '#define RA3_BUILD_ID "${{ github.sha }}"' > runtime/build_id.h
      - name: Build APK
        working-directory: android
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_NODIRECT: '1'
          CCACHE_COMPILERCHECK: 'string:ndk'
          CCACHE_MAXSIZE: 1G
        run: |
          export CCACHE_DIR=$HOME/.ccache
          gradle assembleDebug -PliftedDir=${{ github.workspace }}/lifted -PuseCcache=1 --no-daemon
          ccache -s | head -8

      # The APK is published as a release asset (does not count against the Actions artifact quota).
      - name: Publish APK to the 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ra3-native.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Automatic debug build of main" --prerelease
          gh release upload latest ra3-native.apk --clobber
          gh release edit latest --notes "Build of ${GITHUB_SHA::7} ($(date -u +%F\ %H:%M) UTC)"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ra3-native-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
