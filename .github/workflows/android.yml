name: Android APK

# Two channels:
#  * every push to main -> the 'nightly' pre-release (test builds, tag moved to the built commit)
#  * Actions -> "Android APK" -> Run workflow with a version (e.g. 0.2.0), or a pushed tag vX.Y.Z -> a stable release
#    'vX.Y.Z' with its own version number and a changelog
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to release, e.g. 0.2.0 (leave empty for a nightly build)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
    paths: ['runtime/**', 'tools/**', 'android/**', '.github/workflows/android.yml']

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tags and history for the changelog

      - name: Channel and version
        env: { INPUT_VERSION: '${{ inputs.version }}' }
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V=""; fi
          if [ -n "$V" ]; then
            [[ "$V" =~ ^[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version '$V'"; exit 1; }
            echo "CHANNEL=stable" >> $GITHUB_ENV; echo "APP_VERSION=$V" >> $GITHUB_ENV; echo "TAG=v$V" >> $GITHUB_ENV
          else
            echo "CHANNEL=nightly" >> $GITHUB_ENV; echo "APP_VERSION=nightly" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # The ubuntu runner already ships the Android SDK/NDK; just accept licences.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      # The user's own ra3_1.12.game lives in a separate PRIVATE repo (blackorange-sketch/ra3-private, release "game-binary"),
      # read with the GAME_REPO_TOKEN secret. It is only used inside this job; neither it nor the generated code is published.
      - name: Fetch ra3_1.12.game
        env: { GH_TOKEN: '${{ secrets.GAME_REPO_TOKEN }}' }
        run: |
          gh release download game-binary -R blackorange-sketch/ra3-private -p ra3_1.12.game -D game
          # the Steam build (1.13) is optional
          gh release download game-binary -R blackorange-sketch/ra3-private -p ra3_1.13.game -D game || true
          sha256sum game/*.game

      # Steam build: the stand-in steam_api (runtime/steam.cpp) needs every Steam interface's method table, generated
      # from the Steamworks SDK description (steam_api.json, public in the Steamworks.NET / Facepunch.Steamworks repos)
      - name: Steam interface tables
        run: |
          # headers of Steamworks SDK 1.60 - the interface versions ra3_1.13.game asks for (SteamUtils010, UGC020...)
          git init -q sdkh && git -C sdkh remote add origin https://github.com/rlabrecque/Steamworks.NET \
            && git -C sdkh fetch -q --depth 1 --filter=blob:none origin 7e5ab1859e30dab8162de2327d7fcfd176ce1064 \
            && git -C sdkh sparse-checkout set --no-cone '/CodeGen/steam/*.h' && git -C sdkh checkout -q FETCH_HEAD \
            && python3 tools/steam_gen.py sdkh/CodeGen/steam runtime/steam_ifaces.inc
          ls -la runtime/steam_ifaces.inc || echo "no Steam interface tables (fake interfaces will pop nothing)"
          grep -o '{"[^"]*", "ISteam' runtime/steam_ifaces.inc 2>/dev/null | tr '\n' ' ' | head -c 3000; echo

      - name: Build Capstone
        run: |
          git clone https://github.com/capstone-engine/capstone
          git -C capstone checkout 04fd70b5456c20fc27d1f2b62d6ed0820fc6b081
          for i in 1 2 3 4 5; do sudo apt-get install -y ninja-build >/dev/null && break; sleep 15; sudo apt-get update >/dev/null || true; done; command -v ninja
          cmake -S capstone -B capstone/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_X86_SUPPORT=ON -DCAPSTONE_BUILD_SHARED_LIBS=OFF -DCAPSTONE_BUILD_TESTS=OFF -DCAPSTONE_BUILD_CSTOOL=OFF -DCAPSTONE_BUILD_CSTEST=OFF -DCAPSTONE_BUILD_LEGACY_TESTS=OFF
          ninja -C capstone/b

      - name: Analyze and lift
        run: |
          g++ -O2 -std=c++17 -Icapstone/include tools/analyze.cpp capstone/b/libcapstone.a -o analyze
          g++ -O2 -std=c++17 -Icapstone/include tools/lift.cpp tools/lift_pe.cpp capstone/b/libcapstone.a -o lift_pe
          ./analyze game/ra3_1.12.game game/ra3
          mkdir -p lifted
          # RA3_GATES=addr:pop[:eax]: calls the runtime may skip through ra3_gate: af99f0 = resolution list mode check
          # (wide screen modes accepted)
          # RA3_HOOKS: debug hooks (log arguments/result of these functions): 9ff320 = archive (BIG) stream open by path
          RA3_GATES=af99f0:4:1 RA3_HOOKS=afa2a0 ./lift_pe game/ra3_1.12.game game/ra3.functions.txt --emit-dir lifted 96 | head -3
          if [ -f game/ra3_1.13.game ]; then
            ./analyze game/ra3_1.13.game game/ra313 | head -30
            # imports the Steam build uses that 1.12 does not (each needs a runtime implementation)
            pip install --quiet capstone==5.0.1 || pip install --quiet --break-system-packages capstone==5.0.1
            echo "steam interfaces:"; strings -n 8 game/ra3_1.13.game | grep -E '^(Steam|STEAM)[A-Za-z_]*[0-9]{3}$|^SteamAPI_|^SteamInternal_' | sort -u | head -60
            # the Steam start-up glue: the web request and the registry reader it relies on
            python3 tools/xref.py game/ra3_1.13.game game/ra313.functions.txt --dis 4d47b0-4d49f0 95e080 95e250 4d4f40 || true
            echo "imports only in 1.13:"; awk '{print $2}' game/ra3.imports_used.txt | sort > /tmp/i12; awk '{print $2}' game/ra313.imports_used.txt | sort > /tmp/i13; comm -13 /tmp/i12 /tmp/i13
            # the Steam build: its own library (runtime/game_build.h has its addresses); a93130 = resolution list mode check
            mkdir -p lifted113
            RA3_GATES=a93130:4:1 ./lift_pe game/ra3_1.13.game game/ra313.functions.txt --emit-dir lifted113 96 | head -3
            # addresses the runtime uses in 1.12, translated to the Steam build (only addresses are printed)
            pip install --quiet capstone==5.0.1 || pip install --quiet --break-system-packages capstone==5.0.1
            python3 tools/match_builds.py game/ra3_1.12.game game/ra3.functions.txt game/ra3_1.13.game game/ra313.functions.txt \
              4d398d af99f0 afa2a0 af9790 9c6870 61d660 6297e0 629863 caf9d4 caf9d0 ce2f98 cdb754 cebd54 4cc910 91b040 61c040 61c0d0 4cbbc0 a2b5e0 a2b850 d17d38 cf00b8 || true
          fi

      # The generated code is identical between runs, so ccache makes rebuilds after runtime-only edits take minutes.
      - name: Set up ccache
        run: for i in 1 2 3; do sudo apt-get install -y ccache >/dev/null && break; sleep 20; sudo apt-get update >/dev/null || true; done; true
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Stamp build id
        run: |
          echo '#define RA3_BUILD_ID "${{ github.sha }}"' > runtime/build_id.h
          echo "#define RA3_VERSION \"$APP_VERSION\"" >> runtime/build_id.h
      - name: Build APK
        working-directory: android
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_NODIRECT: '1'
          CCACHE_COMPILERCHECK: 'string:ndk'
          CCACHE_MAXSIZE: 2G
        run: |
          export CCACHE_DIR=$HOME/.ccache
          CC_OPT=""; command -v ccache >/dev/null && CC_OPT="-PuseCcache=1"
          L113=""; [ -d ${{ github.workspace }}/lifted113 ] && L113="-PliftedDir113=${{ github.workspace }}/lifted113"
          gradle assembleDebug -PbuildId=${{ github.sha }} -PversionName=$APP_VERSION -PversionCode=${{ github.run_number }} -PliftedDir=${{ github.workspace }}/lifted $L113 $CC_OPT --no-daemon
          command -v ccache >/dev/null && ccache -s | head -8 || echo "built without ccache"

      # Symbols of the runtime (static functions have no dynamic symbol): the profiler (/sdcard/ra3_prof) logs raw
      # offsets that are resolved with this list. Lifted game functions (f_<address>) are left out, they are exported.
      - name: Runtime symbol list
        run: |
          SO=$(find android/app/build/intermediates -path '*arm64-v8a*' -name libra3native.so -size +1M | xargs ls -S | head -1)
          NM=$(ls $ANDROID_HOME/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm | head -1)
          "$NM" -n -S -C --defined-only "$SO" | grep -iv ' f_00[0-9a-f]*(CPU\*)' | grep -i ' [tw] ' > ra3native-symbols.txt || true
          wc -l ra3native-symbols.txt; echo "from $SO"

      # The APK is published as a release asset (does not count against the Actions artifact quota).
      - name: Changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "${TAG:-none}" HEAD 2>/dev/null || true)
          echo "PREV=$PREV" >> $GITHUB_ENV
          if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..HEAD" > changes.md; else git log --no-merges --pretty='- %s' -n 40 > changes.md; fi

      - name: Publish nightly
        if: env.CHANNEL == 'nightly'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ra3-native.apk
          git tag -f nightly "$GITHUB_SHA" && git push -f origin refs/tags/nightly
          {
            echo "**Test build** of \`${GITHUB_SHA::7}\` ($(date -u +%F\ %H:%M) UTC). It may be broken — stable versions are on the [releases page](https://github.com/$GITHUB_REPOSITORY/releases/latest)."
            echo
            echo "Android 10+, arm64. \`ra3-native.apk\`: $(stat -c %s ra3-native.apk) bytes, SHA-256 \`$(sha256sum ra3-native.apk | cut -d' ' -f1)\` — if the installer says the file is invalid, the download was incomplete: download it again and compare."
            echo
            echo "### Changes since ${PREV:-the first commit}"
            cat changes.md
          } > notes.md
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --title "Nightly build" --notes "Nightly" --prerelease --target "$GITHUB_SHA"
          touch -a lift-stats.txt
          gh release upload nightly ra3-native.apk ra3native-symbols.txt lift-stats.txt --clobber
          gh release edit nightly --notes-file notes.md --prerelease

      - name: Publish stable release
        if: env.CHANNEL == 'stable'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          APK="ra3-native-$TAG.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          {
            echo "Install **$APK** (Android 10+, arm64). You need your own copy of Red Alert 3 1.12 — see the [installation guide](https://github.com/$GITHUB_REPOSITORY#installation)."
            echo
            echo "\`$APK\`: $(stat -c %s "$APK") bytes, SHA-256 \`$(sha256sum "$APK" | cut -d' ' -f1)\` — if the installer says the file is invalid, the download was incomplete: download it again and compare."
            echo
            # hand-written notes in docs/releases/<tag>.md when present, the commit list below them
            if [ -f "docs/releases/$TAG.md" ]; then
              cat "docs/releases/$TAG.md"; echo
              echo "<details><summary>All changes since ${PREV:-the first commit}</summary>"; echo; cat changes.md; echo; echo "</details>"
            else
              echo "### Changes since ${PREV:-the first commit}"
              cat changes.md
            fi
          } > notes.md
          gh release create "$TAG" "$APK" ra3native-symbols.txt --title "RA3 Native $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          # the old single 'latest' pre-release shadows GitHub's /releases/latest link
          gh release delete latest --cleanup-tag -y 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ra3-native-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

